<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>源石學館｜合約管理系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap');
:root{--ink:#1a1a2e;--paper:#faf8f3;--cream:#f0ece0;--red:#8b1a1a;--gold:#b8963e;--line:#d4cfc4;--green:#2d6a4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#ddd8cc;min-height:100vh;padding:28px 16px 60px;color:var(--ink)}
.top-bar{max-width:900px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.school-name{font-family:'Noto Serif TC',serif;font-size:16px;letter-spacing:3px}
.school-sub{font-size:10px;color:#999;letter-spacing:2px;margin-top:2px}
.badge{background:var(--red);color:white;font-size:10px;letter-spacing:2px;padding:4px 12px;border-radius:2px}
.tabs{display:flex;gap:0;max-width:900px;margin:0 auto 0}
.tab{padding:11px 28px;font-family:'Noto Sans TC',sans-serif;font-size:12px;letter-spacing:2px;cursor:pointer;background:var(--cream);border:1px solid var(--line);border-bottom:none;color:#888;transition:all .2s}
.tab.active{background:var(--paper);color:var(--ink);font-weight:600;border-bottom:none}
.card{max-width:900px;margin:0 auto;background:var(--paper);box-shadow:0 4px 32px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.tab-content{display:none;padding:28px 36px}
.tab-content.active{display:block}
.section-title{font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.section-title::before{content:'';display:block;width:3px;height:12px;background:var(--gold);border-radius:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;color:#888;letter-spacing:1px}
.field label span{color:var(--red);margin-left:2px}
.field input,.field select{border:1px solid var(--line);background:white;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--ink);padding:8px 10px;outline:none;transition:border-color .2s;border-radius:2px}
.field input:focus,.field select:focus{border-color:var(--gold)}
.section{margin-bottom:22px}
.info-section{background:var(--cream);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px;border-radius:2px}
.info-section h4{font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.generate-btn{display:block;width:100%;padding:13px;background:var(--ink);color:white;border:none;font-family:'Noto Sans TC',sans-serif;font-size:12px;letter-spacing:5px;cursor:pointer;transition:background .2s;border-radius:2px;margin-top:8px}
.generate-btn:hover{background:var(--red)}
.link-box{display:none;margin-top:18px;border:1.5px solid var(--gold);background:#fffbf0;padding:16px 18px;border-radius:2px}
.link-title{font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:10px}
.link-url{font-size:11.5px;color:var(--ink);background:white;border:1px solid var(--line);padding:9px 12px;border-radius:2px;word-break:break-all;margin-bottom:10px;line-height:1.7}
.link-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:7px 16px;font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:2px;cursor:pointer;border-radius:2px;border:1.5px solid var(--line);background:white;transition:all .2s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.primary{background:var(--gold);color:white;border-color:var(--gold)}
.btn-sm.primary:hover{background:#9a7a30}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.filter-bar input{flex:1;min-width:160px;border:1px solid var(--line);background:white;font-family:'Noto Sans TC',sans-serif;font-size:12px;padding:7px 10px;border-radius:2px;outline:none}
.filter-bar input:focus{border-color:var(--gold)}
.refresh-btn{padding:7px 16px;font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer;border-radius:2px;border:1.5px solid var(--line);background:white}
.refresh-btn:hover{border-color:var(--ink)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-box{background:var(--cream);padding:12px 16px;border-radius:2px;text-align:center;border-left:3px solid var(--line)}
.stat-box.signed{border-left-color:var(--green)}
.stat-box.pending{border-left-color:var(--gold)}
.stat-num{font-size:22px;font-weight:700;color:var(--ink)}
.stat-label{font-size:10px;color:#999;letter-spacing:1px;margin-top:2px}
.contract-row{border:1px solid var(--line);padding:0;margin-bottom:8px;background:white;border-radius:2px;overflow:hidden;transition:box-shadow .2s}
.contract-row:hover{box-shadow:0 2px 12px rgba(0,0,0,.1)}
.row-main{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.row-info{flex:1}
.row-name{font-size:13.5px;font-weight:600}
.row-meta{font-size:11px;color:#999;margin-top:2px}
.row-status{font-size:10px;padding:3px 9px;border-radius:10px;letter-spacing:1px;flex-shrink:0}
.status-pending{background:#fff3e0;color:#b8700a}
.status-signed{background:#e8f5e9;color:#2e7d32}
.row-expand{display:none;border-top:1px solid var(--line);padding:14px 16px;background:#fafaf8}
.row-expand.open{display:block}
.expand-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.expand-item .k{font-size:9px;color:#aaa;letter-spacing:1px;margin-bottom:2px}
.expand-item .v{font-size:12px;color:var(--ink)}
.sig-thumb{max-height:60px;border:1px solid var(--line);background:white;padding:4px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.history-empty{text-align:center;padding:36px;color:#bbb;font-size:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--paper);max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper)}
.modal-header h3{font-family:'Noto Serif TC',serif;font-size:16px;letter-spacing:2px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999;padding:0 4px}
.modal-body{padding:24px}
.preview-art{font-family:'Noto Serif TC',serif;font-size:12px;font-weight:700;margin:14px 0 5px;letter-spacing:2px;color:var(--ink)}
.preview-art:first-child{margin-top:0}
.preview-p{font-size:12px;line-height:1.9;margin-bottom:6px;text-align:justify;color:#333}
.preview-ol{padding-left:18px;margin-bottom:6px;font-size:12px;line-height:1.9;color:#333}
.preview-ol li{margin-bottom:3px}
.preview-party{background:var(--cream);padding:8px 12px;margin-bottom:8px;font-size:11.5px;line-height:1.9}
.preview-hl{background:#fff8e8;border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;font-size:11px;color:#7a5c10}
.preview-dv{border:none;border-top:1px solid var(--line);margin:10px 0}
.preview-amount{border-bottom:1px solid var(--ink);display:inline-block;min-width:60px;text-align:center;font-weight:600;color:var(--red)}
.preview-sig-section{border:1.5px solid var(--line);padding:14px;margin-top:14px}
.preview-sig-title{font-size:11px;letter-spacing:3px;text-align:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--ink)}
.preview-sig-grid{display:flex;gap:16px;align-items:flex-start}
.preview-sig-col{flex:1}
.preview-sig-label{font-size:10px;color:#999;margin-bottom:4px}
.preview-sig-img{max-height:70px;border:1px solid var(--line);background:white;padding:4px;display:block}
.preview-seal{flex:0 0 140px;text-align:center}
.preview-footer{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);font-size:10px;color:#aaa;text-align:center;line-height:1.9}
@media(max-width:600px){.tab-content{padding:20px 16px}.grid,.grid.three,.expand-grid,.stats-row{grid-template-columns:1fr}.link-actions{flex-direction:column}}
/* ── PDF TEMPLATE ── */
#adminPdfWrap{display:none;position:absolute;left:-9999px;top:0}
.pdf-wrap{width:190mm;font-family:'Noto Sans TC','Noto Serif TC',sans-serif;font-size:10pt;line-height:1.85;color:#111;background:white;padding:0}
.pdf-header{text-align:center;padding-bottom:10pt;border-bottom:2pt double #111;margin-bottom:14pt}
.pdf-school{font-size:11.5pt;font-weight:700;letter-spacing:2pt;color:#8b1a1a;margin-bottom:4pt}
.pdf-title{font-size:18pt;font-weight:700;letter-spacing:4pt;margin-bottom:3pt}
.pdf-no{font-size:8.5pt;color:#888;letter-spacing:1pt}
.pdf-art{font-size:10.5pt;font-weight:700;margin:0;padding:8pt 0 4pt;letter-spacing:1pt;color:#1a1a2e;page-break-after:avoid;page-break-inside:avoid}
.pdf-block{page-break-inside:avoid;margin-bottom:4pt}
.pdf-p{margin-bottom:5pt;text-align:justify;page-break-inside:avoid}
.pdf-ol{padding-left:16pt;margin-bottom:5pt;page-break-inside:avoid}
.pdf-ol li{margin-bottom:3pt;page-break-inside:avoid}
.pdf-hl{background:#fffbf0;border-left:3pt solid #b8963e;padding:5pt 9pt;margin:6pt 0;font-size:9pt;color:#7a5c10;page-break-inside:avoid}
.pdf-party{background:#f5f2ec;padding:7pt 11pt;margin-bottom:7pt;font-size:9.5pt;line-height:1.9;page-break-inside:avoid}
.pdf-amount{border-bottom:1pt solid #111;display:inline-block;min-width:55pt;text-align:center;font-weight:700;color:#8b1a1a}
.pdf-dv{border:none;border-top:1pt solid #ccc;margin:10pt 0}
.pdf-sig-section{margin-top:16pt;border:2pt solid #999;padding:12pt 16pt;page-break-inside:avoid}
.pdf-sig-title{font-size:11pt;font-weight:700;letter-spacing:3pt;text-align:center;margin-bottom:14pt;padding-bottom:6pt;border-bottom:1pt solid #ddd;color:#1a1a2e}
.pdf-sig-grid{display:flex;gap:16pt;align-items:flex-start}
.pdf-sig-col{flex:1}
.pdf-sig-col-label{font-size:8.5pt;color:#888;letter-spacing:1pt;margin-bottom:6pt}
.pdf-sig-col-name{font-size:10pt;font-weight:600;margin-bottom:6pt}
.pdf-sig-img-box{border:1pt solid #ddd;background:#fafafa;min-height:55pt;display:flex;align-items:center;justify-content:center;padding:4pt}
.pdf-sig-img{max-height:55pt;max-width:140pt;object-fit:contain}
.pdf-seal-col{flex:0 0 120pt;text-align:center}
.pdf-sig-date{font-size:9pt;color:#666;text-align:right;margin-top:10pt;padding-top:8pt;border-top:1pt solid #eee}
.pdf-footer{margin-top:14pt;padding-top:8pt;border-top:1pt solid #ccc;font-size:8pt;color:#888;text-align:center;line-height:1.9}
.pdf-red{color:#8b1a1a}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="top-bar">
  <div><div class="school-name">源石學館</div><div class="school-sub">文理語文短期補習班　合約管理系統</div></div>
  <div class="badge">管理端</div>
</div>

<div style="max-width:900px;margin:0 auto">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('new')">＋ 新增合約</div>
    <div class="tab" onclick="switchTab('history')" id="historyTab">📋 合約記錄</div>
  </div>
</div>

<div class="card">
  <!-- Tab: New -->
  <div class="tab-content active" id="tab-new">
    <div class="info-section">
      <h4>甲方（學生）資料</h4>
      <div style="font-size:11.5px;color:#888;margin-bottom:10px;padding:8px 12px;background:#fff8e8;border-left:3px solid #b8963e;border-radius:2px">
        💡 僅需填寫學生姓名，其餘資料（電話、地址、法定代理人）由家長在簽署頁面自行填寫。
      </div>
      <div class="grid">
        <div class="field"><label>學生姓名 <span>*</span></label><input id="studentName" placeholder="請填寫學生姓名"></div>
        <div class="field" style="display:none"><input id="studentPhone" value=""></div>
        <div class="field" style="display:none"><input id="studentAddr" value=""></div>
      </div>
    </div>
    <div class="info-section" style="display:none">
      <h4>法定代理人（家長）資料</h4>
      <div class="grid">
        <div class="field"><input id="parentName" value=""></div>
        <div class="field"><input id="parentPhone" value=""></div>
      </div>
    </div>
    <div class="info-section">
      <h4>課程資料</h4>
      <div class="grid three">
        <div class="field"><label>課程科目 <span>*</span></label><input id="subject" placeholder="例：英文"></div>
        <div class="field"><label>每週授課時數</label><input id="hours" placeholder="例：14 小時"></div>
        <div class="field"><label>開課日期 <span>*</span></label><input id="startDate" type="date" value="2025-11-05"></div>
        <div class="field full"><label>任課師資</label><input id="teacher" placeholder="請填寫教師姓名"></div>
      </div>
    </div>
    <div class="info-section">
      <h4>費用資料</h4>
      <div class="grid">
        <div class="field"><label>學費（元）<span>*</span></label><input id="feeTuition" type="number" placeholder="例：10000"></div>
        <div class="field"><label>教材費（元）</label><input id="feeMaterial" type="number" placeholder="例：500"></div>
        <div class="field"><label>其他費用（元）</label><input id="feeOther" type="number" placeholder="例：0"></div>
        <div class="field"><label>繳費方式</label>
          <select id="payMethod"><option value="一次付清">一次付清</option><option value="分兩期繳納">分兩期繳納</option><option value="按月繳納">按月繳納</option></select>
        </div>
      </div>
    </div>
    <button class="generate-btn" onclick="generateLink()">產生家長簽署連結</button>
    <div class="link-box" id="linkBox">
      <div class="link-title">🔗 家長簽署連結（請複製並傳送給家長）</div>
      <div class="link-url" id="linkUrl"></div>
      <div class="link-actions">
        <button class="btn-sm primary" onclick="copyLink()">複製連結</button>
        <button class="btn-sm" onclick="openLink()">預覽頁面</button>
        <button class="btn-sm" onclick="resetForm()">新增下一筆</button>
      </div>
    </div>
  </div>

  <!-- Tab: History -->
  <div class="tab-content" id="tab-history">
    <div class="stats-row" id="statsRow">
      <div class="stat-box"><div class="stat-num" id="statTotal">-</div><div class="stat-label">合約總數</div></div>
      <div class="stat-box signed"><div class="stat-num" id="statSigned">-</div><div class="stat-label">已簽署</div></div>
      <div class="stat-box pending"><div class="stat-num" id="statPending">-</div><div class="stat-label">待簽署</div></div>
    </div>
    <div class="filter-bar">
      <input id="searchInput" placeholder="搜尋學生姓名、課程…" oninput="filterContracts()">
      <button class="refresh-btn" onclick="loadContracts()">↻ 重新整理</button>
      <button class="refresh-btn" onclick="runDiag()" style="background:#fff3cd;border-color:#ffc107;color:#856404">🔍 診斷連線</button>
    </div>
    <div id="diagBox" style="display:none;margin-bottom:12px;padding:12px;background:#f8f9fa;border:1px solid #dee2e6;font-size:11px;font-family:monospace;line-height:1.8;border-radius:2px;word-break:break-all"></div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Modal: Contract Preview -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">服務契約書</h3>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

async function apiGet(){
  const res=await fetch(`${API_URL}?action=list`,{redirect:'follow'});
  const j=await res.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiInsert(data){
  const res=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'insert',data})});
  const j=await res.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiUpdate(id,data){
  const res=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'update',id,data})});
  const j=await res.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

let allContracts=[];

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['new','history'][i]===t));
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='history') loadContracts();
}

async function generateLink(){
  const req=['studentName','subject','startDate','feeTuition'];
  for(const id of req){if(!document.getElementById(id).value.trim()){alert('請填寫必填欄位（標有 * 號）');document.getElementById(id).focus();return;}}
  const t=parseInt(document.getElementById('feeTuition').value)||0;
  const m=parseInt(document.getElementById('feeMaterial').value)||0;
  const o=parseInt(document.getElementById('feeOther').value)||0;
  const total=t+m+o;
  const data={
    studentName:document.getElementById('studentName').value.trim(),
    studentPhone:'',studentAddr:'',parentName:'',parentPhone:'',
    subject:document.getElementById('subject').value.trim(),
    hours:document.getElementById('hours').value.trim(),
    startDate:document.getElementById('startDate').value,
    teacher:document.getElementById('teacher').value.trim(),
    feeTuition:String(t),feeMaterial:String(m),feeOther:String(o),totalFee:total,
    payMethod:document.getElementById('payMethod').value,
    createdAt:new Date().toISOString()
  };
  let cid='';
  try{
    const payload={
      student_name:data.studentName,student_phone:data.studentPhone,student_addr:data.studentAddr,
      parent_name:data.parentName,parent_phone:data.parentPhone,
      subject:data.subject,hours:data.hours,start_date:data.startDate,teacher:data.teacher,
      fee_tuition:data.feeTuition,fee_material:data.feeMaterial,fee_other:data.feeOther,
      total_fee:total,pay_method:data.payMethod,
      status:'pending',contract_data:JSON.stringify(data)
    };
    const row=await apiInsert(payload);
    if(row&&row.id) cid=row.id;
  }catch(e){console.error('insert error:',e);}
  const encoded=btoa(encodeURIComponent(JSON.stringify(data)));
  const url=`${location.origin}/contract.html?d=${encoded}&cid=${cid}`;
  document.getElementById('linkUrl').textContent=url;
  document.getElementById('linkBox').style.display='block';
  document.getElementById('linkBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function copyLink(){navigator.clipboard.writeText(document.getElementById('linkUrl').textContent).then(()=>{const b=event.target;b.textContent='已複製！';setTimeout(()=>b.textContent='複製連結',2000);});}
function openLink(){window.open(document.getElementById('linkUrl').textContent,'_blank');}
function resetForm(){
  ['studentName','studentPhone','parentName','parentPhone','subject','hours','teacher','feeTuition','feeMaterial','feeOther'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('linkBox').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function loadContracts(){
  document.getElementById('historyList').innerHTML='<div class="history-empty">載入中…</div>';
  try{
    allContracts=await apiGet();
    renderContracts(allContracts);
    updateStats(allContracts);
  }catch(err){
    document.getElementById('historyList').innerHTML=`<div class="history-empty">載入失敗：${err.message}</div>`;
    console.error('loadContracts:',err);
  }
}

function updateStats(list){
  document.getElementById('statTotal').textContent=list.length;
  document.getElementById('statSigned').textContent=list.filter(c=>c.status==='signed').length;
  document.getElementById('statPending').textContent=list.filter(c=>c.status==='pending').length;
}

function filterContracts(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  if(!q){renderContracts(allContracts);return;}
  renderContracts(allContracts.filter(c=>(c.student_name||'').toLowerCase().includes(q)||(c.subject||'').toLowerCase().includes(q)||(c.parent_name||'').toLowerCase().includes(q)));
}

function fmtDate(s){return s?s.replace(/-/g,'/'):'—';}
function fmtN(n){return n?parseInt(n).toLocaleString():'0';}

function renderContracts(list){
  const el=document.getElementById('historyList');
  if(!list.length){el.innerHTML='<div class="history-empty">尚無合約記錄</div>';return;}
  el.innerHTML=list.map(c=>{
    const signed=c.status==='signed';
    const D=c.contract_data?JSON.parse(c.contract_data):{};
    const encoded=btoa(encodeURIComponent(JSON.stringify(D)));
    const url=`${location.origin}/contract.html?d=${encoded}&cid=${c.id}`;
    const signedTime=c.signed_at?new Date(c.signed_at).toLocaleString('zh-TW'):'—';
    return `<div class="contract-row" id="row-${c.id}">
      <div class="row-main" onclick="toggleRow('${c.id}')">
        <div class="row-info">
          <div class="row-name">${c.student_name||'—'} ／ ${c.subject||'—'}</div>
          <div class="row-meta">家長：${c.parent_name||'—'}　｜　開課：${fmtDate(c.start_date)}　｜　NT$ ${fmtN(c.total_fee)}　｜　建立：${new Date(c.created_at).toLocaleDateString('zh-TW')}</div>
        </div>
        <span class="row-status ${signed?'status-signed':'status-pending'}">${signed?'✅ 已簽署':'⏳ 待簽署'}</span>
      </div>
      <div class="row-expand" id="expand-${c.id}">
        <div class="expand-grid">
          <div class="expand-item"><div class="k">學生電話</div><div class="v">${c.student_phone||'—'}</div></div>
          <div class="expand-item"><div class="k">師資</div><div class="v">${c.teacher||'—'}</div></div>
          <div class="expand-item"><div class="k">每週時數</div><div class="v">${c.hours||'—'}</div></div>
          <div class="expand-item"><div class="k">繳費方式</div><div class="v">${c.pay_method||'—'}</div></div>
          <div class="expand-item"><div class="k">簽署時間</div><div class="v">${signedTime}</div></div>
          <div class="expand-item"><div class="k">家長 Email</div><div class="v">${c.parent_email||'—'}</div></div>
          ${signed&&c.signature_url?`<div class="expand-item"><div class="k">家長簽名</div><img class="sig-thumb" src="${c.signature_url}" alt="簽名"></div>`:''}
        </div>
        <div class="row-actions">
          <button class="btn-sm primary" onclick="viewContract('${c.id}')">👁 查看完整合約</button>
          <button class="btn-sm" onclick="copyUrl('${url}')">複製連結</button>
          ${signed?`<button class="btn-sm" id="send-btn-${c.id}" onclick="sendPdfEmail('${c.id}')">📧 寄送合約 PDF</button>`:''}
          ${signed?`<button class="btn-sm" onclick="downloadPDF('${c.id}')">⬇ 下載 PDF</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleRow(id){document.getElementById('expand-'+id).classList.toggle('open');}
function copyUrl(url){navigator.clipboard.writeText(url).then(()=>alert('連結已複製！'));}

function viewContract(id){
  const c=allContracts.find(x=>x.id===id);
  if(!c)return;
  const D=c.contract_data?JSON.parse(c.contract_data):{};
  const signed=c.status==='signed';
  const signedTime=c.signed_at?new Date(c.signed_at).toLocaleString('zh-TW'):'尚未簽署';
  const total=parseInt(c.total_fee||0);

async function sendPdfEmail(id){
  const c=allContracts.find(x=>x.id===id);
  if(!c)return;
  const email=c.parent_email||'';
  if(!email){alert('此合約沒有家長 Email，無法寄送。\n請家長重新填寫簽署頁面。');return;}
  const confirmed=confirm(`確認要將合約 PDF 寄送至：
${email}

（收件人：${c.parent_name||'家長'}）`);
  if(!confirmed)return;
  const btn=document.getElementById('send-btn-'+id);
  if(btn){btn.textContent='產生中...';btn.disabled=true;}
  try{
    const pdfBase64=await generatePdfBase64(c);
    if(btn){btn.textContent='寄送中...';}
    const res=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'sendPdf',id:c.id,to_email:email,to_name:c.parent_name||'家長',student_name:c.student_name||'',pdf_base64:pdfBase64})});
    const data=await res.json();
    if(data.ok){alert(`✅ 已成功寄送至 ${email}`);if(btn){btn.textContent='✅ 已寄出';btn.disabled=false;}}
    else throw new Error(data.error||'寄送失敗');
  }catch(err){
    alert('❌ 寄送失敗：'+err.message);
    if(btn){btn.textContent='📧 寄送合約 PDF';btn.disabled=false;}
  }
}

async function downloadPDF(id){
  const c=allContracts.find(x=>x.id===id);
  if(!c)return;
  const btn=event.target;
  btn.textContent='產生中...';btn.disabled=true;
  try{
    const base64=await generatePdfBase64(c);
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`源石學館_服務契約書_${c.student_name}.pdf`;a.click();
    URL.revokeObjectURL(url);
    btn.textContent='⬇ 下載 PDF';btn.disabled=false;
  }catch(err){
    alert('❌ 下載失敗：'+err.message);
    btn.textContent='⬇ 下載 PDF';btn.disabled=false;
  }
}

setInterval(()=>{
  if(document.getElementById('tab-history').classList.contains('active')) loadContracts();
},30000);

async function runDiag(){
  const box=document.getElementById('diagBox');
  box.style.display='block';
  box.innerHTML='🔄 測試中...<br>';
  const log=(msg)=>{box.innerHTML+=msg+'<br>';};
  log(`📍 API = ${API_URL.substring(0,60)}...`);
  try{
    const data=await apiGet();
    log(`✅ 成功！找到 ${data.length} 筆記錄`);
    allContracts=data;
    renderContracts(data);
    updateStats(data);
    box.style.display='none';
  }catch(e){
    log(`❌ 錯誤：${e.message}`);
  }
}
